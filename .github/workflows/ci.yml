name: UI Test Automation CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # ubuntu-latest ships Chrome; Selenium Manager (built into Selenium 4.6+)
      # resolves the matching chromedriver at runtime — no driver binary to
      # install or commit.
      - name: Run UI regression suite (headless)
        run: mvn -B test -Dheadless=true

      - name: Upload Extent report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-report
          retention-days: 30

  publish-report:
    needs: test
    if: github.ref == 'refs/heads/master' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Extent report
        uses: actions/download-artifact@v4
        with:
          name: extent-report
          path: extent-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: extent-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
